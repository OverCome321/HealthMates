version: '3.8'

services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=sa
      - DB_PASSWORD=admin
      - DB_NAME=healthmates
      - JWT_SECRET=your-secret-key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - healthmates-network
    dns:
      - 8.8.8.8
      - 1.1.1.1

networks:
  healthmates-network:
    driver: bridge